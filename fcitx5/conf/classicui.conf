# Vertical Candidate List
Vertical Candidate List=False
# Use Per Screen DPI on X11
PerScreenDPI=True
# Force font DPI on Wayland. 0 keeps compositor defaults.
ForceWaylandDPI=0
# Font
Font="Hack Nerd Font 10"
# Menu Font
MenuFont="Hack Nerd Font 10"
# Tray Font
TrayFont="Hack Nerd Font Bold 10"
# Tray Label Outline Color
TrayOutlineColor=#2e3440
# Tray Label Text Color
TrayTextColor=#47E4AE
# Prefer Text Icon
PreferTextIcon=True
# Theme
Theme=nord-waybar
# Dark Theme
DarkTheme=nord-waybar
# Use Dark Theme
UseDarkTheme=True
